[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genome-format-converters"
version = "0.1.0"
description = "A collection of Python scripts for converting common bioinformatics file formats"
readme = "README.md"
authors = [
    {name = "Benjamin Narh-Madey", email = "narhmadey@swisc.edu"},
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.6"
dependencies = [
    "biopython>=1.78",
    "pandas>=1.0",
    "pysam>=0.16",
]

[project.urls]
"Homepage" = "https://github.com/K-nie/genome-format-converters"
"Bug Tracker" = "https://github.com/K-nie/genome-format-converters/issues"

[project.scripts]
gfc = "genome_format_converters.cli:main"

[tool.setuptools.packages.find]
where = ["src"]