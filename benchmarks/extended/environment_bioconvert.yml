# BioConvert in its own env (its dependency set clashes with gfc-bench).
# run_paper_rerun.sh points GFC_BENCH_BIOCONVERT at this env's bioconvert.
#
#   mamba env create -f benchmarks/extended/environment_bioconvert.yml
name: gfc-bioconvert
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - bioconvert=1.2.0
  - gotree           # newick2nexus's only method (E15)
  - pysam            # fasta_qual2fastq (E04)
